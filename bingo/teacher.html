<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Culture Class Bingo — Teacher</title>
  <link rel="stylesheet" href="../assets/css/site.css?v=20261030-teacher-proj">
  <link rel="stylesheet" href="../assets/css/halloween.css?v=20261030-teacher-proj">
</head>
<body class="halloween-theme bingo-halloween bingo-teacher">
  <div class="wrap" id="app">
    <p class="hint">Loading…</p>
  </div>
  <script type="module">
    import {
      backToMonthLink,
      getMonthIdFromQuery,
      loadMonthsMeta,
      loadWordPool,
      playBingoTermAudio,
      shuffle,
    } from "../js/bingo.js";

    let monthId = "10";
    let meta = null;
    let month = null;
    let pool = [];
    let terms = [];
    let bootError = "";
    let called = new Set();

    async function loadBoot() {
      monthId = getMonthIdFromQuery();
      meta = await loadMonthsMeta();
      month = meta?.months?.find((m) => m.id === monthId);
      pool = await loadWordPool(monthId);
      terms = pool.map((t) => t.term);
      if (!terms.length) throw new Error("empty word pool");
    }

    const app = document.getElementById("app");
    let displayOrder = [];

    function render() {
      const back = backToMonthLink(monthId, meta);
      if (!displayOrder.length) displayOrder = shuffle(terms);
      const chips = displayOrder
        .map((word) => {
          const isCalled = called.has(word);
          return `<button type="button" class="word-chip${isCalled ? " called" : ""}" data-word="${word.replace(/"/g, "&quot;")}">${word}</button>`;
        })
        .join("");
      const errLine = bootError
        ? `<p class="hint" role="status">${bootError}</p>`
        : "";

      app.innerHTML = `
        <a class="back-link" href="${back}">← Back to month</a>
        ${errLine}
        <header class="site-header">
          <h1>Bingo — Teacher</h1>
          <p>${month ? `${month.name}: ${month.theme}` : "Culture Class"} · Month ${monthId}</p>
        </header>
        <p class="hint">Tap a word when you call it. Project this page for the class. Students use <a href="student.html?month=${monthId}">student cards</a>.</p>
        <div class="bingo-toolbar">
          <button type="button" class="btn btn-secondary" id="btn-reset">Reset called</button>
          <button type="button" class="btn btn-primary" id="btn-random">Call random</button>
        </div>
        <div class="word-pool" id="pool">${chips}</div>
        <p class="hint">Called: <strong id="called-count">${called.size}</strong> / ${terms.length}</p>
        <footer class="site-footer">Bingo v0 — offline · Firebase sync later</footer>`;

      document.getElementById("pool").addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-word]");
        if (!btn) return;
        const w = btn.getAttribute("data-word");
        await playBingoTermAudio(monthId, w);
        if (called.has(w)) called.delete(w);
        else called.add(w);
        render();
      });

      document.getElementById("btn-reset").addEventListener("click", () => {
        called = new Set();
        render();
      });

      document.getElementById("btn-random").addEventListener("click", () => {
        const remaining = terms.filter((t) => !called.has(t));
        if (!remaining.length) return;
        const pick = remaining[Math.floor(Math.random() * remaining.length)];
        called.add(pick);
        render();
      });
    }

    (async () => {
      try {
        await loadBoot();
      } catch (err) {
        console.error(err);
        bootError = "Could not load word list — showing October bingo.";
        try {
          monthId = "10";
          await loadBoot();
        } catch (err2) {
          console.error(err2);
          terms = [];
        }
      }
      displayOrder = shuffle(terms);
      render();
    })();
  </script>
</body>
</html>
