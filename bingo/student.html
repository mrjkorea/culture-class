<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Culture Class Bingo — Student</title>
  <link rel="stylesheet" href="../assets/css/site.css">
  <link rel="stylesheet" href="../assets/css/halloween.css">
</head>
<body class="halloween-theme bingo-halloween">
  <div class="wrap" id="app">
    <p class="hint">Loading…</p>
  </div>
  <script type="module">
    import {
      backToMonthLink,
      getMonthIdFromQuery,
      loadMonthsMeta,
      loadWordPool,
      shuffle,
      wordImageForTerm,
    } from "../js/bingo.js";
    import { playWordAudio } from "../js/words-audio.js";
    import { setStepDone } from "../js/month-progress.js";

    const monthId = getMonthIdFromQuery();
    const meta = await loadMonthsMeta();
    const month = meta?.months?.find((m) => m.id === monthId);
    const pool = await loadWordPool(monthId);
    const terms = pool.map((t) => t.term);

    function buildCard(words) {
      const size = 16;
      const need = 15;
      const bag = [];
      while (bag.length < need) bag.push(...shuffle(words));
      const cells = bag.slice(0, need);
      const grid = [];
      const cols = 4;
      let i = 0;
      for (let r = 0; r < cols; r++) {
        for (let c = 0; c < cols; c++) {
          const center = r === 1 && c === 1;
          if (center) {
            grid.push({ text: "FREE", free: true, marked: true });
          } else {
            grid.push({ text: cells[i++], free: false, marked: false });
          }
        }
      }
      return { grid, cols };
    }

    let card = buildCard(terms);

    function cellHtml(cell, idx) {
      const cls = ["bingo-cell", cell.free ? "free" : "", cell.marked ? "marked" : ""]
        .filter(Boolean)
        .join(" ");
      if (cell.free) return `<div class="${cls}" data-idx="${idx}">FREE</div>`;
      const img = wordImageForTerm(cell.text, pool);
      const pic = img ? `<img src="${img}" alt="">` : "";
      return `<div class="${cls}" data-idx="${idx}" role="button" tabindex="0">${pic}<span>${cell.text}</span></div>`;
    }

    function render() {
      const back = backToMonthLink(monthId, meta);
      const cells = card.grid.map((cell, idx) => cellHtml(cell, idx)).join("");

      document.getElementById("app").innerHTML = `
        <a class="back-link" href="${back}">← Back to month</a>
        <header class="halloween-hero">
          <h2>Bingo — Student</h2>
          <p>${month ? `${month.name}: ${month.theme}` : "Culture Class"} · Tap a picture to hear the word</p>
        </header>
        <p class="hint"><a href="teacher.html?month=${monthId}">Teacher call list</a></p>
        <div class="bingo-toolbar" style="justify-content:center">
          <button type="button" class="btn btn-glow" id="btn-new">New card</button>
        </div>
        <div class="bingo-grid" style="grid-template-columns: repeat(${card.cols}, 1fr)">${cells}</div>
        <footer class="site-footer">Bingo — local card</footer>`;

      document.querySelector(".bingo-grid").addEventListener("click", (e) => {
        const cell = e.target.closest("[data-idx]");
        if (!cell) return;
        const idx = Number(cell.getAttribute("data-idx"));
        const item = card.grid[idx];
        if (item.free) return;
        setStepDone(monthId, "bingo");
        const row = pool.find((t) => t.term === item.text);
        void playWordAudio(item.text, row?.audio);
        item.marked = !item.marked;
        render();
      });

      document.getElementById("btn-new").addEventListener("click", () => {
        card = buildCard(terms);
        render();
      });
    }

    render();
  </script>
</body>
</html>
