<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Jack-o'-Lantern Craft — Mr. Jay's Culture Class October mini-game">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='11' fill='%23ff8c1a'/%3E%3Cpath d='M16 6c1-4 6-5 7-2' fill='none' stroke='%232f9e3a' stroke-width='2'/%3E%3C/svg%3E">
  <title>Jack-o'-Lantern Craft — Culture Class</title>
  <link rel="stylesheet" href="css/game.css" id="craft-game-css">
  <link rel="stylesheet" href="https://mrjkorea.github.io/mrj-signin/mrj-auth.css?v=20261030-cf-login-1.7.3">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>
</head>
<body>
  <div class="sky">
    <header class="topbar">
      <a class="top-link" id="back-link" href="../../months/10-october/">October</a>
      <p class="top-title" id="top-game-title">Pumpkin Craft</p>
      <div class="top-actions">
        <label class="lang-wrap craft-lang-wrap">
          <span class="sr-only" id="lang-label">Language</span>
          <select id="lang-select" aria-labelledby="lang-label"></select>
        </label>
        <button type="button" id="sound-btn" aria-pressed="true" aria-label="Sound on">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 10l5 5M21 10l-5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </header>
    <main id="view">
      <p class="boot">Loading craft…</p>
    </main>
  </div>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <script src="https://mrjkorea.github.io/mrj-signin/mrj-auth.js?v=20261030-cf-login-1.7.3"></script>
  <script src="../../js/culture-auth-boot.js" data-mrj-app="culture-class"></script>
  <script type="module">
    import { CRAFT_ASSET_V } from "./js/asset-version.js";
    const css = document.getElementById("craft-game-css");
    if (css) css.href = `css/game.css?v=${CRAFT_ASSET_V}`;
    import(`./js/game.js?v=${CRAFT_ASSET_V}`);
  </script>
</body>
</html>
