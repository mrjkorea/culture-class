<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Thanksgiving Feast — Mr. Jay's Culture Class November craft">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' x='4' font-size='22'%3E🦃%3C/text%3E%3C/svg%3E">
  <title>Thanksgiving Feast — Culture Class</title>
<link rel="stylesheet" href="https://mrjkorea.github.io/mrj-signin/mrj-auth.css?v=20261030-cf-login-1.7.3">
  <link rel="stylesheet" href="css/game.css" id="craft-game-css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.min.js"
    }
  }
  </script>
</head>
<body>
  <div class="sky feast-sky">
    <header class="topbar">
      <a class="top-link" id="back-link" href="../../months/11-november/">November</a>
      <p class="top-title" id="top-game-title">Thanksgiving</p>
      <div class="top-actions">
        <label class="lang-wrap craft-lang-wrap">
          <span class="sr-only" id="lang-label">Language</span>
          <select id="lang-select" aria-labelledby="lang-label"></select>
        </label>
        <button type="button" id="sound-btn" aria-pressed="true" aria-label="Sound on">
          <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
          <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 10l5 5M21 10l-5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </header>
    <main id="view">
      <p class="boot">Loading craft…</p>
    </main>
  </div>
  <button type="button" id="teacher-btn">Teacher</button>
  <form id="teacher-form" hidden>
    <label for="teacher-pin">Teacher password</label>
    <input id="teacher-pin" type="password" autocomplete="off" inputmode="text">
    <button type="submit">Unlock</button>
    <p id="teacher-error" role="alert"></p>
  </form>
  <button type="button" id="skip-btn" hidden>Skip</button>
  <p id="live" class="sr-only" aria-live="polite"></p>
  <script src="https://mrjkorea.github.io/mrj-signin/mrj-auth.js?v=20261030-cf-login-1.7.3"></script>
  <script>
    (function () {
      var slot = document.createElement("div");
      slot.hidden = true;
      slot.setAttribute("aria-hidden", "true");
      document.body.appendChild(slot);
      if (window.MRJ_AUTH && typeof window.MRJ_AUTH.mount === "function") {
        window.MRJ_AUTH.mount(slot, { app: "culture-class", chromeOff: true });
      }
    })();
  </script>
  <script type="module">
    import { CRAFT_ASSET_V } from "./js/asset-version.js?v=20261127-click-place";
    const css = document.querySelector('link[href*="css/game.css"]') || document.getElementById("craft-game-css");
    if (css) css.href = `css/game.css?v=${CRAFT_ASSET_V}`;
    import(`./js/game.js?v=${CRAFT_ASSET_V}`);
  </script>
<script src="../../js/mrj-scores.js?v=20261112-identity"></script>
<script src="../../js/culture-scores.js?v=20261111-scores"></script>
</body>
</html>
